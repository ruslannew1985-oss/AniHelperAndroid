name: Build School 6 APK

on:
  push:
    branches:
      - school-6-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease

      - name: Find Android SDK build-tools
        id: buildtools
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "path=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -keystore school6.jks \
            -storepass school62026 \
            -keypass school62026 \
            -alias school6 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=School6, OU=Android, O=School6, L=Moscow, C=RU"

      - name: Sign APK
        shell: bash
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          "${{ steps.buildtools.outputs.path }}/zipalign" -f -p 4 "$UNSIGNED_APK" aligned.apk
          "${{ steps.buildtools.outputs.path }}/apksigner" sign \
            --ks school6.jks \
            --ks-key-alias school6 \
            --ks-pass pass:school62026 \
            --key-pass pass:school62026 \
            --out School6.apk \
            aligned.apk
          "${{ steps.buildtools.outputs.path }}/apksigner" verify --verbose School6.apk

      - name: Upload School6 APK
        uses: actions/upload-artifact@v4
        with:
          name: School6-APK
          path: School6.apk
