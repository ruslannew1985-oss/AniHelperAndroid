:root{--bg:#0f1127;--panel:#1c2141;--panel2:#252a52;--ink:#f8f9ff;--muted:#b1b9dd;--purple:#a579ff;--violet:#6949d5;--green:#56e5ac}*{box-sizing:border-box}html{scroll-behavior:smooth;background:#0f1127}body{min-height:100vh;margin:0;background:radial-gradient(ellipse 130% 480px at 50% -150px,#3e266f 0%,#171a37 57%,var(--bg) 100%) fixed;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Roboto,"Noto Sans",sans-serif}button,input{font:inherit}button{cursor:pointer}#app{max-width:820px;min-height:100vh;margin:auto;padding:22px 16px 110px}.topbar{display:flex;align-items:center;gap:14px;margin:0 0 26px}.logo{display:grid;place-items:center;flex-shrink:0;width:57px;height:57px;border-radius:18px;font-size:33px;font-weight:900;background:linear-gradient(140deg,#b06fff,#623dec 65%,#2cb4df);box-shadow:0 9px 30px #6f4ff366;border:1px solid #b594ff}.top-title{font-size:23px;line-height:1.13;font-weight:850;letter-spacing:-.5px}.subtitle,.small{font-size:13px;color:var(--muted)}.hero{border:1px solid #7556b680;border-radius:27px;padding:24px 20px 21px;background:linear-gradient(145deg,#5933a7cc,#25284d 72%);position:relative;overflow:hidden;box-shadow:0 15px 55px #0a0a2550}.hero:after{content:'✦';position:absolute;right:14px;top:-22px;font-size:100px;color:#ffffff16}.eyebrow{font-weight:800;letter-spacing:1.2px;font-size:11px;text-transform:uppercase;color:#d0b9ff}.hero h1{font-size:31px;line-height:1.12;letter-spacing:-.6px;margin:10px 0}.hero p{margin:0;max-width:340px;font-size:14px;color:#e0dcff}.metric-row{display:flex;gap:10px;margin:20px 0 0}.metric{padding:9px 13px;border:1px solid #ffffff2b;background:#ffffff0c;border-radius:14px;font-size:12px}.metric b{font-size:18px;display:block;color:#fff}.search{display:flex;align-items:center;gap:10px;padding:0 15px;border:1px solid #6c6eac78;background:#222546;height:53px;border-radius:16px;margin:20px 0 24px}.search span{font-size:21px;color:#bea7ff}.search input{background:transparent;border:0;outline:0;color:white;min-width:0;width:100%;font-size:15px}.search input::placeholder{color:#a7a9d2}.heading{display:flex;justify-content:space-between;align-items:baseline;margin:24px 3px 14px;gap:8px}.heading strong{font-size:19px}.heading small{color:var(--muted);font-size:12px}.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subject{border:1px solid color-mix(in srgb,var(--c),transparent 35%);background:linear-gradient(130deg,color-mix(in srgb,var(--c),transparent 76%),#1a1e3d 78%);border-radius:20px;padding:20px 11px 15px;min-height:150px;text-align:left;color:white;display:flex;flex-direction:column;align-items:flex-start;gap:8px;box-shadow:0 14px 28px #03081333}.subject .sym{display:grid;place-items:center;width:43px;height:43px;background:color-mix(in srgb,var(--c),transparent 75%);color:var(--c);border-radius:13px;font-size:25px;font-weight:800}.subject b{font-size:18px}.subject small{font-size:12px;color:#c3cbed}.subject .trailing{margin-left:auto;margin-top:auto;color:var(--c);font-weight:700}.grid-list{display:grid;gap:10px}.lesson{display:flex;align-items:center;gap:14px;border:1px solid #565d905e;border-radius:18px;padding:14px;background:#202541;color:white;text-align:left;width:100%}.lesson:active,.subject:active,.nav-btn:active{transform:scale(.98)}.lesson .num{flex-shrink:0;display:grid;place-items:center;background:#7153d8;color:white;border-radius:12px;width:39px;height:39px;font-size:15px;font-weight:800}.lesson .num.geo{background:#2176bf}.lesson .num.phy{background:#087d73}.lesson .num.rus{background:#ba416a}.lesson .num.eng{background:#a77625;color:#fff8df}.lesson b{display:block;font-size:15px}.lesson small{display:block;font-size:12px;color:var(--muted);margin-top:3px;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lesson .arrow{margin-left:auto;font-size:23px;color:#a8a8df}.back{border:0;background:#2b2b52;color:white;width:43px;height:43px;border-radius:13px;font-size:23px;flex-shrink:0}.headings{font-size:25px;line-height:1.12;font-weight:850}.tag{display:inline-flex;padding:5px 10px;background:var(--c);color:#0f122b;font-weight:850;border-radius:9px;font-size:11px;letter-spacing:.2px}.hintline{color:var(--muted);margin:9px 0}.formula{border-radius:20px;background:linear-gradient(105deg,#38275b,#222449);border:1px solid #8b64c780;padding:20px;margin:20px 0}.formula .math{font-size:20px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:750;color:#f6eaff;margin-top:10px}.tip{border:1px solid #e1b55b66;background:linear-gradient(100deg,#7c572333,#363044);padding:15px 17px;border-radius:18px;margin:12px 0 22px;color:#f2e0ad}.tip b{color:#ffd278}.tip p{margin:6px 0 0;font-size:14px}.excard{margin:12px 0;background:#1d2445;border:1px solid #625a99a1;border-radius:19px;overflow:hidden}.exheader{width:100%;border:0;background:transparent;display:flex;gap:13px;align-items:center;text-align:left;color:white;padding:16px}.bubble{background:#784fef;display:grid;place-items:center;border-radius:12px;min-width:32px;height:32px;font-size:16px;font-weight:850}.ex-title{font-size:14px;line-height:1.45;font-weight:700;flex:1}.chev{font-size:22px;color:#c2a5ff}.exbody{padding:0 16px 17px}.mini-tip{background:#b88d3824;border-left:3px solid #f5cb65;color:#fae7b5;font-size:13px;border-radius:7px;padding:9px 12px;margin:4px 0 12px}.step{display:flex;align-items:flex-start;gap:11px;margin:10px 0;color:#e6eafc;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.step i{font-style:normal;display:grid;place-items:center;background:#277d6a;color:#bbffe0;width:25px;height:25px;flex-shrink:0;border-radius:50%;font-size:12px;font-weight:900}.translation{color:#a9dcff;background:#20426755;border:1px solid #479acb55;padding:10px 12px;border-radius:11px;margin:8px 0 3px;font-size:14px}.translation b{color:#71c9ff}.ans{background:#1a664e66;border:1px solid #42dc9da1;border-radius:11px;padding:10px 12px;color:#b7ffdd;font-weight:850;margin-top:14px;overflow-wrap:anywhere}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pill{border:1px solid #7776af88;border-radius:100px;background:#252a4c;color:#eef0ff;padding:9px 14px;font-size:13px}.pill.active{background:#7448dd;border-color:#a180ff}.empty{color:#bfc4e4;text-align:center;padding:50px 20px}.bottom{display:flex;align-items:stretch;justify-content:space-around;gap:4px;position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:820px;background:#151931ee;backdrop-filter:blur(18px);border-top:1px solid #545b844d;padding:9px 8px calc(10px + env(safe-area-inset-bottom))}.nav-btn{background:none;color:#b6bad8;border:0;padding:5px 12px;display:grid;justify-items:center;gap:2px;font-size:11px}.nav-btn span{font-size:22px}.nav-btn.active{color:#ba8cff;font-weight:800}.progress{margin:15px 0 10px;border-radius:9px;height:8px;background:#494663;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#9e6dff,#4bd6b1);transition:width .2s}.toast{font-size:12px;color:var(--muted)}@media(min-width:600px){#app{padding:28px 34px 115px}.subjects{grid-template-columns:repeat(5,1fr)}.hero h1{font-size:39px}}@media(max-width:599px){.subject:last-child{grid-column:span 2;min-height:112px;display:grid;grid-template-columns:52px 1fr auto;align-items:center;column-gap:12px;row-gap:2px}.subject:last-child .sym{grid-row:1/4}.subject:last-child b{grid-column:2}.subject:last-child small{grid-column:2}.subject:last-child .trailing{grid-column:3;grid-row:1/4;white-space:nowrap}}@media(max-width:350px){.subjects{gap:9px}.subject{padding:14px 10px}.subject b{font-size:15px}.hero h1{font-size:26px}}
</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Решебник 7"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head><body><main id="app"></main><nav class="bottom" id="navbar"></nav><script>window.LESSONS = [{"id":"alg1","subject":"alg","title":"Приведение подобных слагаемых","formula":"ax + bx = (a + b)x","hint":"Складывай только слагаемые с одинаковой буквенной частью.","examples":[{"question":"7x + 3x − 2x","steps":["(7 + 3 − 2)x = 8x"],"answer":"8x"},{"question":"5a − 9a + 6a","steps":["(5 − 9 + 6)a = 2a"],"answer":"2a"},{"question":"4x + 3y − x + 2y","steps":["(4 − 1)x + (3 + 2)y"],"answer":"3x + 5y"}]},{"id":"alg2","subject":"alg","title":"Линейные уравнения","formula":"ax + b = c ⇒ x = (c − b) / a, a ≠ 0","hint":"Перенеси числа в одну сторону, неизвестные — в другую, затем раздели.","examples":[{"question":"3x + 7 = 22","steps":["3x = 22 − 7 = 15","x = 15 : 3 = 5"],"answer":"x = 5"},{"question":"5x − 9 = 16","steps":["5x = 16 + 9 = 25","x = 25 : 5"],"answer":"x = 5"},{"question":"7 − 2x = 17","steps":["−2x = 17 − 7 = 10","x = 10 : (−2)"],"answer":"x = −5"}]},{"id":"alg3","subject":"alg","title":"Раскрытие скобок","formula":"a(b + c) = ab + ac","hint":"Множитель перед скобкой умножается на каждый член. Минус меняет знаки.","examples":[{"question":"3(2x − 5)","steps":["3·2x − 3·5 = 6x − 15"],"answer":"6x − 15"},{"question":"−(a − 8)","steps":["−a + 8"],"answer":"−a + 8"},{"question":"2(x + 4) − 3x","steps":["2x + 8 − 3x = 8 − x"],"answer":"8 − x"}]},{"id":"alg4","subject":"alg","title":"Степень с натуральным показателем","formula":"aⁿ = a · a · … · a (n раз)","hint":"Основание повторяется в произведении столько раз, сколько показывает степень.","examples":[{"question":"2⁵","steps":["2·2·2·2·2 = 32"],"answer":"32"},{"question":"(−3)³","steps":["(−3)·(−3)·(−3) = −27"],"answer":"−27"},{"question":"(−2)⁴","steps":["Чётная степень отрицательного числа положительна","2·2·2·2 = 16"],"answer":"16"}]},{"id":"alg5","subject":"alg","title":"Свойства степеней","formula":"aᵐ·aⁿ = aᵐ⁺ⁿ; aᵐ:aⁿ = aᵐ⁻ⁿ (a≠0, m≥n)","hint":"При одинаковом основании умножение складывает показатели, деление — вычитает.","examples":[{"question":"x³ · x⁴","steps":["x³⁺⁴ = x⁷"],"answer":"x⁷"},{"question":"a⁸ : a³","steps":["a⁸⁻³ = a⁵"],"answer":"a⁵"},{"question":"(b²)³","steps":["Показатели перемножаем: 2·3 = 6","(b²)³ = b⁶"],"answer":"b⁶"}]},{"id":"alg6","subject":"alg","title":"Одночлены","formula":"(axᵐ)(bxⁿ) = abxᵐ⁺ⁿ","hint":"Перемножь числа, затем буквы. Степени одинаковых букв сложи.","examples":[{"question":"3x² · 4x³","steps":["3·4 = 12; x²·x³ = x⁵"],"answer":"12x⁵"},{"question":"−2ab · 5a²","steps":["−2·5 = −10; a·a² = a³"],"answer":"−10a³b"},{"question":"(3x²)²","steps":["3² · (x²)² = 9x⁴"],"answer":"9x⁴"}]},{"id":"alg7","subject":"alg","title":"Умножение многочленов","formula":"(a + b)(c + d) = ac + ad + bc + bd","hint":"Каждый член первой скобки умножь на каждый член второй.","examples":[{"question":"(x + 2)(x + 3)","steps":["x² + 3x + 2x + 6","x² + 5x + 6"],"answer":"x² + 5x + 6"},{"question":"(x − 4)(x + 1)","steps":["x² + x − 4x − 4"],"answer":"x² − 3x − 4"},{"question":"(2a + 1)(a − 5)","steps":["2a² − 10a + a − 5"],"answer":"2a² − 9a − 5"}]},{"id":"alg8","subject":"alg","title":"Квадрат суммы и разности","formula":"(a±b)² = a² ± 2ab + b²","hint":"Средний член — удвоенное произведение двух слагаемых.","examples":[{"question":"(x + 4)²","steps":["x² + 2·x·4 + 4²"],"answer":"x² + 8x + 16"},{"question":"(a − 3)²","steps":["a² − 2·a·3 + 3²"],"answer":"a² − 6a + 9"},{"question":"(2x + 1)²","steps":["(2x)² + 2·2x·1 + 1²"],"answer":"4x² + 4x + 1"}]},{"id":"alg9","subject":"alg","title":"Разность квадратов","formula":"a² − b² = (a − b)(a + b)","hint":"Работает только когда между двумя квадратами стоит минус.","examples":[{"question":"x² − 25","steps":["25 = 5²","(x − 5)(x + 5)"],"answer":"(x − 5)(x + 5)"},{"question":"9a² − 16","steps":["9a² = (3a)²; 16 = 4²"],"answer":"(3a − 4)(3a + 4)"},{"question":"49 − y²","steps":["49 = 7²","(7 − y)(7 + y)"],"answer":"(7 − y)(7 + y)"}]},{"id":"alg10","subject":"alg","title":"Вынесение общего множителя","formula":"ab + ac = a(b + c)","hint":"Найди общий делитель коэффициентов и общую буквенную часть.","examples":[{"question":"6x + 9","steps":["Общий множитель 3","6x + 9 = 3(2x + 3)"],"answer":"3(2x + 3)"},{"question":"5a² − 10a","steps":["Общий множитель 5a","5a(a − 2)"],"answer":"5a(a − 2)"},{"question":"x² + 4x","steps":["В обоих членах есть x","x(x + 4)"],"answer":"x(x + 4)"}]},{"id":"alg11","subject":"alg","title":"Линейная функция","formula":"y = kx + b","hint":"Чтобы найти y, подставь значение x. График — прямая.","examples":[{"question":"y = 2x + 3, x = 4","steps":["y = 2·4 + 3 = 8 + 3"],"answer":"y = 11"},{"question":"y = −x + 5, x = −2","steps":["y = −(−2) + 5"],"answer":"y = 7"},{"question":"y = 3x − 6. Найди пересечение с Ox","steps":["На оси Ox: y = 0","0 = 3x − 6 ⇒ x = 2"],"answer":"(2; 0)"}]},{"id":"alg12","subject":"alg","title":"Системы линейных уравнений","formula":"{x + y = a; x − y = b} ⇒ 2x = a + b","hint":"Сложи или вычти уравнения, чтобы убрать одну переменную.","examples":[{"question":"x + y = 10; x − y = 4","steps":["Складываем: 2x = 14 ⇒ x = 7","y = 10 − 7 = 3"],"answer":"x = 7; y = 3"},{"question":"2x + y = 11; x + y = 7","steps":["Вычитаем второе: x = 4","y = 7 − 4 = 3"],"answer":"x = 4; y = 3"},{"question":"x + 2y = 8; x − y = 2","steps":["Вычитаем: 3y = 6 ⇒ y = 2","x = 2 + 2 = 4"],"answer":"x = 4; y = 2"}]},{"id":"geo1","subject":"geo","title":"Смежные углы","formula":"α + β = 180°","hint":"Смежные углы образуют развёрнутый угол.","examples":[{"question":"Один угол 65°. Найди смежный","steps":["180° − 65° = 115°"],"answer":"115°"},{"question":"Смежные углы равны. Найди каждый","steps":["180° : 2 = 90°"],"answer":"90° и 90°"},{"question":"Углы x и 2x смежные","steps":["x + 2x = 180°","3x = 180° ⇒ x = 60°"],"answer":"60° и 120°"}]},{"id":"geo2","subject":"geo","title":"Вертикальные углы","formula":"α = β","hint":"Вертикальные углы образованы пересечением двух прямых и всегда равны.","examples":[{"question":"Угол 48°. Найди вертикальный","steps":["Вертикальные углы равны"],"answer":"48°"},{"question":"Угол 127°. Найди вертикальный","steps":["127° = 127°"],"answer":"127°"},{"question":"Вертикальные углы 3x + 10 и 70","steps":["3x + 10 = 70","3x = 60 ⇒ x = 20"],"answer":"x = 20"}]},{"id":"geo3","subject":"geo","title":"Сумма углов треугольника","formula":"α + β + γ = 180°","hint":"Вычти из 180° сумму двух известных углов.","examples":[{"question":"Углы 50° и 60°. Найди третий","steps":["180° − 50° − 60° = 70°"],"answer":"70°"},{"question":"Два угла по 45°. Найди третий","steps":["180° − 45° − 45° = 90°"],"answer":"90°"},{"question":"Углы x, 2x, 3x","steps":["x + 2x + 3x = 180°","x = 30°"],"answer":"30°, 60°, 90°"}]},{"id":"geo4","subject":"geo","title":"Равнобедренный треугольник","formula":"Углы при основании равны","hint":"Если две стороны равны, то равны углы напротив них.","examples":[{"question":"Вершинный угол 40°. Найди углы при основании","steps":["(180° − 40°) : 2 = 70°"],"answer":"70° и 70°"},{"question":"Угол при основании 55°. Найди вершину","steps":["180° − 2·55° = 70°"],"answer":"70°"},{"question":"Угол при основании 35°. Найди второй и вершину","steps":["Второй угол 35°","Вершинный: 180° − 70° = 110°"],"answer":"35° и 110°"}]},{"id":"geo5","subject":"geo","title":"Периметр треугольника","formula":"P = a + b + c","hint":"Периметр — сумма длин всех сторон.","examples":[{"question":"Стороны 3, 4, 5 см","steps":["P = 3 + 4 + 5"],"answer":"12 см"},{"question":"Стороны 7, 7, 9 см","steps":["P = 7 + 7 + 9"],"answer":"23 см"},{"question":"P = 30 см, стороны 9 и 11 см. Найди третью","steps":["c = 30 − 9 − 11"],"answer":"10 см"}]},{"id":"geo6","subject":"geo","title":"Площадь треугольника","formula":"S = (a·h) / 2","hint":"Высота должна быть проведена к выбранному основанию.","examples":[{"question":"Основание 10 см, высота 6 см","steps":["S = 10·6 : 2"],"answer":"30 см²"},{"question":"Основание 7 см, высота 4 см","steps":["S = 7·4 : 2"],"answer":"14 см²"},{"question":"S = 24 см², основание 8 см. Найди высоту","steps":["h = 2S/a = 48/8"],"answer":"6 см"}]},{"id":"geo7","subject":"geo","title":"Прямоугольный треугольник","formula":"Два острых угла в сумме дают 90°","hint":"Один угол уже равен 90°, поэтому оставшиеся два — дополнительные.","examples":[{"question":"Один острый угол 32°. Найди другой","steps":["90° − 32° = 58°"],"answer":"58°"},{"question":"Острые углы равны","steps":["90° : 2 = 45°"],"answer":"45° и 45°"},{"question":"Острые углы x и 2x","steps":["x + 2x = 90°","3x = 90°"],"answer":"30° и 60°"}]},{"id":"geo8","subject":"geo","title":"Углы при параллельных прямых","formula":"Накрест лежащие и соответственные углы равны","hint":"При секущей проверь расположение углов; односторонние дают 180°.","examples":[{"question":"Накрест лежащий угол к 72°","steps":["Накрест лежащие углы равны"],"answer":"72°"},{"question":"Односторонний угол к 110°","steps":["180° − 110° = 70°"],"answer":"70°"},{"question":"Соответственный угол к 38°","steps":["Соответственные углы равны"],"answer":"38°"}]},{"id":"geo9","subject":"geo","title":"Внешний угол треугольника","formula":"Внешний угол = сумма двух внутренних несмежных","hint":"Не путай внешний угол с прилежащим к нему внутренним.","examples":[{"question":"Удалённые внутренние углы 35° и 65°","steps":["35° + 65° = 100°"],"answer":"100°"},{"question":"Внешний 120°, один удалённый 50°","steps":["120° − 50° = 70°"],"answer":"70°"},{"question":"Внутренний при вершине 75°. Найди внешний","steps":["180° − 75° = 105°"],"answer":"105°"}]},{"id":"geo10","subject":"geo","title":"Неравенство треугольника","formula":"|a − b| < c < a + b","hint":"Сумма любых двух сторон должна быть больше третьей.","examples":[{"question":"Можно ли построить 3, 4, 8 см?","steps":["3 + 4 = 7 < 8","Условие не выполнено"],"answer":"Нет"},{"question":"Можно ли построить 5, 6, 7 см?","steps":["5 + 6 > 7; 5 + 7 > 6; 6 + 7 > 5"],"answer":"Да"},{"question":"Стороны 4, 9 см. Какие целые c возможны?","steps":["9 − 4 < c < 9 + 4","5 < c < 13"],"answer":"6, 7, 8, 9, 10, 11, 12 см"}]},{"id":"geo11","subject":"geo","title":"Биссектриса угла","formula":"α₁ = α₂ = α / 2","hint":"Биссектриса делит угол на два равных угла.","examples":[{"question":"Угол 80°. Найди каждую часть","steps":["80° : 2 = 40°"],"answer":"40° и 40°"},{"question":"Половина угла 27°. Найди полный","steps":["27°·2 = 54°"],"answer":"54°"},{"question":"Угол 3x + 10°, половина равна 35°","steps":["3x + 10 = 70","3x = 60 ⇒ x = 20"],"answer":"x = 20"}]},{"id":"geo12","subject":"geo","title":"Признаки равенства треугольников","formula":"СУС (две стороны и угол между ними); УСУ; ССС","hint":"Для первого признака угол должен лежать между равными сторонами.","examples":[{"question":"AB = DE, AC = DF, ∠A = ∠D","steps":["Две стороны и угол между ними равны","Первый признак"],"answer":"Треугольники равны"},{"question":"AB = DE, ∠A = ∠D, ∠B = ∠E","steps":["Сторона и два прилежащих угла равны","Второй признак"],"answer":"Треугольники равны"},{"question":"AB = DE, BC = EF, AC = DF","steps":["Три стороны попарно равны","Третий признак"],"answer":"Треугольники равны"}]},{"id":"phy1","subject":"phy","title":"Скорость, путь, время","formula":"v = s / t; s = vt; t = s / v","hint":"Приводи единицы к единой системе: м, с, м/с.","examples":[{"question":"Путь 120 м за 20 с. Найди v","steps":["v = 120 / 20"],"answer":"6 м/с"},{"question":"Скорость 5 м/с, время 12 с. Найди s","steps":["s = 5·12"],"answer":"60 м"},{"question":"Путь 180 км, v = 60 км/ч. Найди t","steps":["t = 180 / 60"],"answer":"3 ч"}]},{"id":"phy2","subject":"phy","title":"Средняя скорость","formula":"vср = sобщ / tобщ","hint":"Используй весь путь и всё время, включая остановки.","examples":[{"question":"100 км за 2 ч","steps":["vср = 100/2"],"answer":"50 км/ч"},{"question":"За 3 ч 180 км, за 2 ч 120 км","steps":["s = 180 + 120 = 300 км; t = 5 ч","vср = 300/5"],"answer":"60 км/ч"},{"question":"20 км за 1 ч и 40 км за 3 ч","steps":["s = 60 км, t = 4 ч","vср = 60/4"],"answer":"15 км/ч"}]},{"id":"phy3","subject":"phy","title":"Плотность вещества","formula":"ρ = m / V; m = ρV; V = m / ρ","hint":"Не путай массу и вес. Для плотности нужны масса и объём.","examples":[{"question":"m = 200 г, V = 50 см³","steps":["ρ = 200/50"],"answer":"4 г/см³"},{"question":"ρ = 2 г/см³, V = 30 см³","steps":["m = 2·30"],"answer":"60 г"},{"question":"m = 540 г, ρ = 2,7 г/см³","steps":["V = 540/2,7"],"answer":"200 см³"}]},{"id":"phy4","subject":"phy","title":"Сила тяжести","formula":"Fтяж = mg; g ≈ 10 Н/кг","hint":"Для школьных задач обычно берут g ≈ 10 Н/кг, если не дано другое.","examples":[{"question":"m = 3 кг. Найди Fтяж","steps":["F = 3·10"],"answer":"30 Н"},{"question":"Fтяж = 50 Н. Найди m","steps":["m = F/g = 50/10"],"answer":"5 кг"},{"question":"m = 250 г. Найди Fтяж","steps":["250 г = 0,25 кг","F = 0,25·10"],"answer":"2,5 Н"}]},{"id":"phy5","subject":"phy","title":"Сила упругости. Закон Гука","formula":"Fупр = k·Δl","hint":"Удлинение Δl записывай в метрах; k — жёсткость в Н/м.","examples":[{"question":"k = 100 Н/м, Δl = 0,03 м","steps":["F = 100·0,03"],"answer":"3 Н"},{"question":"F = 8 Н, k = 200 Н/м","steps":["Δl = F/k = 8/200"],"answer":"0,04 м"},{"question":"k = 50 Н/м, Δl = 2 см","steps":["2 см = 0,02 м","F = 50·0,02"],"answer":"1 Н"}]},{"id":"phy6","subject":"phy","title":"Давление твёрдого тела","formula":"p = F / S","hint":"Чем меньше площадь опоры, тем больше давление при той же силе.","examples":[{"question":"F = 100 Н, S = 2 м²","steps":["p = 100/2"],"answer":"50 Па"},{"question":"F = 200 Н, S = 0,5 м²","steps":["p = 200/0,5"],"answer":"400 Па"},{"question":"p = 300 Па, S = 0,2 м²","steps":["F = pS = 300·0,2"],"answer":"60 Н"}]},{"id":"phy7","subject":"phy","title":"Давление жидкости","formula":"p = ρgh","hint":"Давление растёт с глубиной; h — глубина под поверхностью.","examples":[{"question":"Вода, ρ = 1000 кг/м³, h = 2 м","steps":["p = 1000·10·2"],"answer":"20 000 Па"},{"question":"Вода, h = 0,5 м","steps":["p = 1000·10·0,5"],"answer":"5 000 Па"},{"question":"ρ = 800 кг/м³, h = 3 м","steps":["p = 800·10·3"],"answer":"24 000 Па"}]},{"id":"phy8","subject":"phy","title":"Архимедова сила","formula":"FА = ρж g Vпогруж","hint":"Используй объём погружённой части тела, а не всегда весь объём.","examples":[{"question":"В воде погружено V = 0,002 м³","steps":["FА = 1000·10·0,002"],"answer":"20 Н"},{"question":"В воде V = 0,0005 м³","steps":["FА = 1000·10·0,0005"],"answer":"5 Н"},{"question":"В масле ρ = 900 кг/м³, V = 0,01 м³","steps":["FА = 900·10·0,01"],"answer":"90 Н"}]},{"id":"phy9","subject":"phy","title":"Механическая работа","formula":"A = F·s (сила направлена вдоль движения)","hint":"Если сила перпендикулярна движению, работа этой силы равна нулю.","examples":[{"question":"F = 20 Н, s = 5 м","steps":["A = 20·5"],"answer":"100 Дж"},{"question":"A = 240 Дж, F = 30 Н","steps":["s = A/F = 240/30"],"answer":"8 м"},{"question":"A = 150 Дж, s = 3 м","steps":["F = A/s = 150/3"],"answer":"50 Н"}]},{"id":"phy10","subject":"phy","title":"Мощность","formula":"N = A / t","hint":"Мощность показывает, сколько работы совершается за единицу времени.","examples":[{"question":"A = 600 Дж, t = 30 с","steps":["N = 600/30"],"answer":"20 Вт"},{"question":"N = 50 Вт, t = 10 с","steps":["A = Nt = 50·10"],"answer":"500 Дж"},{"question":"A = 1200 Дж, N = 100 Вт","steps":["t = A/N = 1200/100"],"answer":"12 с"}]},{"id":"phy11","subject":"phy","title":"Момент силы и рычаг","formula":"M = F·l; в равновесии F₁l₁ = F₂l₂","hint":"Плечо силы — кратчайшее расстояние от оси вращения до линии действия силы.","examples":[{"question":"F = 10 Н, плечо 0,3 м","steps":["M = 10·0,3"],"answer":"3 Н·м"},{"question":"F₁ = 20 Н, l₁ = 0,5 м, l₂ = 1 м","steps":["F₂ = F₁l₁/l₂ = 20·0,5/1"],"answer":"10 Н"},{"question":"F₁ = 6 Н, l₁ = 2 м, F₂ = 4 Н","steps":["l₂ = F₁l₁/F₂ = 6·2/4"],"answer":"3 м"}]},{"id":"phy12","subject":"phy","title":"КПД простого механизма","formula":"η = (Aпол / Aзат) · 100%","hint":"КПД не может быть больше 100% в реальном механизме.","examples":[{"question":"Полезная работа 80 Дж, затрачено 100 Дж","steps":["η = 80/100 · 100%"],"answer":"80%"},{"question":"Полезная 150 Дж, затрачено 200 Дж","steps":["η = 150/200 · 100%"],"answer":"75%"},{"question":"η = 60%, затрачено 500 Дж","steps":["Aпол = 0,6·500"],"answer":"300 Дж"}]},{"id":"rus1","subject":"rus","title":"Причастие","formula":"Причастие — признак предмета по действию; какой? что делающий?","hint":"Найди глагол, от которого образовано слово, и определяемое существительное.","examples":[{"question":"«Читающий мальчик» — найди причастие","steps":["Читающий — признак по действию","Образовано от глагола «читать»"],"answer":"читающий"},{"question":"«Прочитанная книга» — найди причастие","steps":["Прочитанная — признак по действию","От глагола «прочитать»"],"answer":"прочитанная"},{"question":"«Сверкающая звезда» — найди причастие","steps":["Сверкающая — отвечает на «какая?»","От глагола «сверкать»"],"answer":"сверкающая"}]},{"id":"rus2","subject":"rus","title":"Причастный оборот и запятые","formula":"После определяемого слова оборот обычно выделяется запятыми","hint":"Найди причастие с зависимыми словами и существительное, которое оно определяет.","examples":[{"question":"«Дом построенный недавно красив»","steps":["Оборот «построенный недавно» стоит после «дом»","Дом, построенный недавно, красив."],"answer":"Дом, построенный недавно, красив."},{"question":"«Прочитанная вчера книга интересна»","steps":["Оборот перед словом «книга»","Запятая обычно не нужна"],"answer":"Прочитанная вчера книга интересна."},{"question":"«Листья опавшие осенью лежали»","steps":["«Опавшие осенью» после «листья»","Выделяем запятыми"],"answer":"Листья, опавшие осенью, лежали."}]},{"id":"rus3","subject":"rus","title":"Н и НН в полных причастиях","formula":"В полных страдательных причастиях прошедшего времени обычно НН","hint":"Для причастия ищи приставку (кроме не-), зависимое слово или совершенный вид.","examples":[{"question":"«прочита..ая книга»","steps":["Причастие от совершенного вида «прочитать»","Пишем НН"],"answer":"прочитанная книга"},{"question":"«жаре..ая на масле картошка»","steps":["Есть зависимое слово «на масле»","Пишем НН"],"answer":"жаренная на масле картошка"},{"question":"«краше..ый забор» без зависимых слов","steps":["Отглагольное прилагательное без приставки и зависимых слов","Пишем одну Н"],"answer":"крашеный забор"}]},{"id":"rus4","subject":"rus","title":"НЕ с причастиями","formula":"С полным причастием раздельно при зависимых словах или противопоставлении с «а»","hint":"Без зависимых слов и противопоставления полное причастие часто пишется слитно.","examples":[{"question":"«(не)прочитанная книга»","steps":["Нет зависимых слов и противопоставления","Пишем слитно"],"answer":"непрочитанная книга"},{"question":"«(не)прочитанная мной книга»","steps":["Есть зависимое слово «мной»","Пишем раздельно"],"answer":"не прочитанная мной книга"},{"question":"«Книга (не)прочитана»","steps":["Краткое причастие: НЕ всегда отдельно"],"answer":"Книга не прочитана."}]},{"id":"rus5","subject":"rus","title":"Деепричастие","formula":"Деепричастие — добавочное действие; что делая? что сделав?","hint":"Относится к тому же действующему лицу, что и основное сказуемое.","examples":[{"question":"«Улыбаясь, он вошёл» — найди деепричастие","steps":["Что делая? улыбаясь","От глагола «улыбаться»"],"answer":"улыбаясь"},{"question":"«Закончив урок, дети вышли»","steps":["Что сделав? закончив"],"answer":"закончив"},{"question":"«Читая, я делал заметки»","steps":["Что делая? читая"],"answer":"читая"}]},{"id":"rus6","subject":"rus","title":"Деепричастный оборот","formula":"Деепричастный оборот обычно выделяется запятыми","hint":"Найди деепричастие вместе с зависимыми словами; обособляй его.","examples":[{"question":"«Он шёл улыбаясь прохожим»","steps":["Оборот «улыбаясь прохожим»","Выделяем запятой"],"answer":"Он шёл, улыбаясь прохожим."},{"question":"«Прочитав книгу я уснул»","steps":["Оборот в начале предложения"],"answer":"Прочитав книгу, я уснул."},{"question":"«Мы сидели слушая музыку и рисовали»","steps":["Оборот «слушая музыку» внутри предложения"],"answer":"Мы сидели, слушая музыку, и рисовали."}]},{"id":"rus7","subject":"rus","title":"НЕ с деепричастиями","formula":"НЕ с деепричастиями обычно пишется раздельно","hint":"Исключение: если слово без НЕ не употребляется (негодуя).","examples":[{"question":"«(не)зная ответа, он молчал»","steps":["«Зная» употребляется без НЕ","Раздельно"],"answer":"не зная"},{"question":"«(не)прочитав письмо, я ушёл»","steps":["«Прочитав» употребляется без НЕ","Раздельно"],"answer":"не прочитав"},{"question":"«(не)годуя, он спорил»","steps":["«Годуя» не употребляется","Слитно"],"answer":"негодуя"}]},{"id":"rus8","subject":"rus","title":"Наречие","formula":"Наречие чаще всего обозначает признак действия: как? где? когда?","hint":"Наречия обычно не изменяются.","examples":[{"question":"«Он бежал быстро»","steps":["Бежал как? быстро","Это наречие"],"answer":"быстро"},{"question":"«Вчера был дождь»","steps":["Был когда? вчера"],"answer":"вчера"},{"question":"«Птицы летят высоко»","steps":["Летят где? высоко"],"answer":"высоко"}]},{"id":"rus9","subject":"rus","title":"НЕ с наречиями на -о/-е","formula":"Слитно при замене синонимом без НЕ; раздельно при противопоставлении с «а»","hint":"Проверь слова «вовсе не», «далеко не», «отнюдь не» — они требуют раздельного написания.","examples":[{"question":"«Он говорил (не)громко»","steps":["Можно заменить «тихо»","Слитно"],"answer":"негромко"},{"question":"«Он говорил (не)громко, а тихо»","steps":["Противопоставление с «а»","Раздельно"],"answer":"не громко, а тихо"},{"question":"«Это вовсе (не)просто»","steps":["Есть «вовсе не»","Раздельно"],"answer":"вовсе не просто"}]},{"id":"rus10","subject":"rus","title":"Дефис в наречиях","formula":"по- + -ому/-ему/-ски/-цки; во-/в- + -ых/-их","hint":"Наречия с кое- и суффиксами -то, -либо, -нибудь тоже пишутся через дефис.","examples":[{"question":"«(по)новому решить»","steps":["По- + -ому","Ставим дефис"],"answer":"по-новому"},{"question":"«(во)первых, начнём»","steps":["Во- + -ых","Ставим дефис"],"answer":"во-первых"},{"question":"«(кое)где спрятано»","steps":["Приставка кое-","Ставим дефис"],"answer":"кое-где"}]},{"id":"rus11","subject":"rus","title":"Производные предлоги","formula":"в течение, в продолжение, вследствие — предлоги пишутся слитно/раздельно по словарным правилам","hint":"Различай предлог и существительное: предлог нельзя склонять и заменить определением.","examples":[{"question":"«(В)течение часа»","steps":["Значение времени; производный предлог","Раздельно"],"answer":"в течение часа"},{"question":"«(В)следствие дождя матч отменили»","steps":["Причина = из-за дождя","Слитно"],"answer":"вследствие дождя"},{"question":"«(В)течении реки заметны изменения»","steps":["Существительное «течение» с предлогом «в»","Окончание -и"],"answer":"в течении реки"}]},{"id":"rus12","subject":"rus","title":"Союзы ТОЖЕ, ТАКЖЕ, ЧТОБЫ","formula":"Союзы «тоже», «также», «чтобы» пишутся слитно; местоимение + частица — раздельно","hint":"Попробуй убрать «же»/«бы»: если смысл почти не меняется, это местоимение с частицей.","examples":[{"question":"«Я (то)же пойду»","steps":["Можно заменить «и я»","Союз"],"answer":"Я тоже пойду."},{"question":"«Сделай так (же), как вчера»","steps":["Можно убрать «же»: «так, как вчера»","Раздельно"],"answer":"Сделай так же, как вчера."},{"question":"«Я хочу, (что)бы всё получилось»","steps":["Союз цели: «чтобы»","Слитно"],"answer":"Я хочу, чтобы всё получилось."}]},{"id":"eng1","subject":"eng","title":"Глагол to be: am, is, are","formula":"I am; he/she/it is; you/we/they are. Отрицание: am not / isn’t / aren’t.","hint":"To be — «быть, являться, находиться». В настоящем времени он нужен там, где по-русски связку часто опускают.","examples":[{"question":"She ___ my sister.","steps":["She — третье лицо, ед. число: используем is.","She + is + my sister."],"answer":"She is my sister.","translation":"Она моя сестра."},{"question":"I ___ not late.","steps":["После I ставим am.","I + am not + late."],"answer":"I am not late.","translation":"Я не опоздал."},{"question":"___ they at school?","steps":["В вопросе выносим are перед подлежащим they.","Are + they + at school?"],"answer":"Are they at school?","translation":"Они в школе?"}]},{"id":"eng2","subject":"eng","title":"Личные и объектные местоимения","formula":"I→me, you→you, he→him, she→her, it→it, we→us, they→them.","hint":"Кто выполняет действие? I/he/we. На кого направлено действие? me/him/us.","examples":[{"question":"Give ___ (I) a pen.","steps":["После give нужен объект, не подлежащее.","I → me."],"answer":"Give me a pen.","translation":"Дай мне ручку."},{"question":"___ (they) like music.","steps":["Перед глаголом нужно местоимение-подлежащее.","they остаётся they."],"answer":"They like music.","translation":"Они любят музыку."},{"question":"I can see ___ (she).","steps":["После see нужен объектный падеж.","she → her."],"answer":"I can see her.","translation":"Я вижу её."}]},{"id":"eng3","subject":"eng","title":"Притяжательные местоимения","formula":"my/mine, your/yours, his/his, her/hers, our/ours, their/theirs.","hint":"My, your, her стоят перед существительным. Mine, yours, hers заменяют существительное.","examples":[{"question":"This is ___ (I) bag.","steps":["Перед существительным bag нужен притяжательный определитель.","I → my."],"answer":"This is my bag.","translation":"Это моя сумка."},{"question":"The blue bike is ___ (he).","steps":["После is нет существительного: нужна самостоятельная форма.","he → his."],"answer":"The blue bike is his.","translation":"Синий велосипед принадлежит ему."},{"question":"Is this notebook ___ (you)?","steps":["После notebook существительное не повторяем.","you → yours."],"answer":"Is this notebook yours?","translation":"Эта тетрадь твоя?"}]},{"id":"eng4","subject":"eng","title":"Present Simple: настоящее простое","formula":"I/you/we/they + V; he/she/it + V-s/-es. Отрицание: don’t / doesn’t + V.","hint":"Используется для привычек, расписаний и общеизвестных фактов. После doesn’t глагол без -s.","examples":[{"question":"He ___ (play) football every Sunday.","steps":["He — третье лицо ед. числа, действие повторяется.","play + s → plays."],"answer":"He plays football every Sunday.","translation":"Он играет в футбол каждое воскресенье."},{"question":"We ___ (not/watch) TV in the morning.","steps":["We — множественное число: don’t + начальная форма.","do not + watch."],"answer":"We don’t watch TV in the morning.","translation":"Мы не смотрим телевизор по утрам."},{"question":"___ she ___ (like) apples?","steps":["Вопрос с she: does в начале, like без -s.","Does + she + like?"],"answer":"Does she like apples?","translation":"Она любит яблоки?"}]},{"id":"eng5","subject":"eng","title":"Окончания -s, -es, -ies у глаголов","formula":"play→plays; watch→watches; study→studies; have→has.","hint":"После согласной + y: y→ies. После -sh, -ch, -x, -ss, -o: часто -es. После гласной + y: просто -s.","examples":[{"question":"She ___ (study) English.","steps":["study оканчивается на согласную + y.","study → studies."],"answer":"She studies English.","translation":"Она изучает английский язык."},{"question":"Dad ___ (wash) the car.","steps":["После -sh добавляем -es.","wash → washes."],"answer":"Dad washes the car.","translation":"Папа моет машину."},{"question":"Tom ___ (have) breakfast at 8.","steps":["Have имеет особую форму с he/she/it.","have → has."],"answer":"Tom has breakfast at 8.","translation":"Том завтракает в восемь."}]},{"id":"eng6","subject":"eng","title":"Present Continuous: настоящее длительное","formula":"am/is/are + V-ing. Отрицание: am not/isn’t/aren’t + V-ing.","hint":"Действие происходит сейчас или вокруг настоящего момента; сигналы: now, at the moment, Look!","examples":[{"question":"Look! They ___ (dance).","steps":["Действие видно прямо сейчас; they → are.","are + dancing."],"answer":"Look! They are dancing.","translation":"Смотри! Они танцуют."},{"question":"I ___ (not/sleep) now.","steps":["С I используем am not + -ing.","am not + sleeping."],"answer":"I am not sleeping now.","translation":"Я сейчас не сплю."},{"question":"___ he ___ (read) now?","steps":["Вопрос: is перед he; read + ing.","Is + he + reading?"],"answer":"Is he reading now?","translation":"Он сейчас читает?"}]},{"id":"eng7","subject":"eng","title":"Present Simple или Present Continuous?","formula":"usually/every day → Present Simple; now/at the moment → Present Continuous.","hint":"Смотри на смысл: привычка — Simple, действие сейчас — Continuous. Stative verbs (know, like, want) обычно без Continuous.","examples":[{"question":"She usually ___ (walk) to school.","steps":["Usually указывает на регулярность.","She + walks (Present Simple)."],"answer":"She usually walks to school.","translation":"Обычно она ходит в школу пешком."},{"question":"She ___ (walk) to school right now.","steps":["Right now — прямо сейчас.","She + is walking."],"answer":"She is walking to school right now.","translation":"Она прямо сейчас идёт в школу."},{"question":"I ___ (know) the answer.","steps":["Know — глагол состояния; обычно выбираем Simple.","I + know, без am knowing."],"answer":"I know the answer.","translation":"Я знаю ответ."}]},{"id":"eng8","subject":"eng","title":"Past Simple: прошедшее простое","formula":"V-ed или 2-я форма неправильного глагола; did not + V; Did + S + V?","hint":"Действие закончилось в прошлом: yesterday, last week, two days ago. После did глагол в начальной форме.","examples":[{"question":"We ___ (visit) grandma yesterday.","steps":["Правильный глагол visit → прошедшее -ed.","visit → visited."],"answer":"We visited grandma yesterday.","translation":"Мы навестили бабушку вчера."},{"question":"She ___ (not/go) to school yesterday.","steps":["После didn’t — go, не went.","did not + go."],"answer":"She didn’t go to school yesterday.","translation":"Вчера она не ходила в школу."},{"question":"___ you ___ (see) the film?","steps":["Вопрос о прошлом: Did в начале, see — начальная форма.","Did + you + see?"],"answer":"Did you see the film?","translation":"Ты видел этот фильм?"}]},{"id":"eng9","subject":"eng","title":"Неправильные глаголы: 3 формы","formula":"go–went–gone; see–saw–seen; take–took–taken; write–wrote–written; eat–ate–eaten; do–did–done; be–was/were–been; have–had–had; make–made–made; come–came–come; read–read–read.","hint":"В Past Simple нужна 2-я форма; в Present Perfect после have/has — 3-я. Произношение read меняется: [riːd] → [red].","examples":[{"question":"Yesterday I ___ (go) to the park.","steps":["Yesterday требует Past Simple; вторая форма go — went.","go–went–gone → went."],"answer":"Yesterday I went to the park.","translation":"Вчера я ходил в парк."},{"question":"She has ___ (write) a letter.","steps":["После has нужна третья форма.","write–wrote–written → written."],"answer":"She has written a letter.","translation":"Она написала письмо."},{"question":"He ___ (eat) an apple an hour ago.","steps":["An hour ago — законченное прошлое.","eat–ate–eaten → ate."],"answer":"He ate an apple an hour ago.","translation":"Он съел яблоко час назад."}]},{"id":"eng10","subject":"eng","title":"Past Continuous: прошедшее длительное","formula":"was/were + V-ing; I/he/she/it → was, you/we/they → were.","hint":"Длительное действие в определённый момент прошлого или фон для другого действия: at 6 yesterday, while.","examples":[{"question":"At 8 yesterday I ___ (do) homework.","steps":["Указан момент в прошлом, действие длилось.","I + was doing."],"answer":"At 8 yesterday I was doing homework.","translation":"Вчера в восемь я делал домашнее задание."},{"question":"They ___ (not/play) at 5.","steps":["They → were, отрицание weren’t.","were not + playing."],"answer":"They weren’t playing at 5.","translation":"В пять часов они не играли."},{"question":"___ she ___ (sleep) when you called?","steps":["Вопрос о длительном действии: was + she + sleeping.","Was + she + sleeping?"],"answer":"Was she sleeping when you called?","translation":"Она спала, когда ты позвонил?"}]},{"id":"eng11","subject":"eng","title":"Past Simple или Past Continuous?","formula":"while + was/were + V-ing; when + Past Simple (часто).","hint":"Длительное действие было фоном, короткое событие его прервало; выбор зависит от смысла, а не только от when/while.","examples":[{"question":"I ___ (read) when the phone rang.","steps":["Чтение продолжалось, звонок прервал его.","was reading + when + rang."],"answer":"I was reading when the phone rang.","translation":"Я читал, когда зазвонил телефон."},{"question":"When we ___ (arrive), it was raining.","steps":["Прибытие — короткое завершённое событие.","arrive → arrived (Past Simple)."],"answer":"When we arrived, it was raining.","translation":"Когда мы приехали, шёл дождь."},{"question":"While Mum ___ (cook), I set the table.","steps":["Готовка была длительным фоновым действием.","Mum + was cooking."],"answer":"While Mum was cooking, I set the table.","translation":"Пока мама готовила, я накрыл на стол."}]},{"id":"eng12","subject":"eng","title":"Present Perfect: результат к настоящему","formula":"have/has + V³ (3-я форма); haven’t/hasn’t + V³; Have/Has + S + V³?","hint":"Важно, что результат связан с настоящим; часто already, just, yet, ever, never. Не указывай законченное yesterday вместе с Present Perfect.","examples":[{"question":"I have ___ (finish) my homework.","steps":["Have + третья форма; finish правильный глагол.","finish → finished."],"answer":"I have finished my homework.","translation":"Я закончил домашнюю работу (она готова)."},{"question":"She ___ (not/see) this film yet.","steps":["She → has; отрицание hasn’t + seen.","has not + seen."],"answer":"She hasn’t seen this film yet.","translation":"Она ещё не смотрела этот фильм."},{"question":"___ you ever ___ (be) to London?","steps":["Вопрос об опыте: Have + you + ever + been.","be–was/were–been."],"answer":"Have you ever been to London?","translation":"Ты когда-нибудь бывал в Лондоне?"}]},{"id":"eng13","subject":"eng","title":"Present Perfect и Past Simple: разница","formula":"Past Simple: last year, yesterday, in 2022. Present Perfect: already, ever, yet, just, so far.","hint":"Если названо конкретное завершённое время, выбирай Past Simple. Если важен опыт или результат сейчас — Present Perfect.","examples":[{"question":"I ___ (lose) my keys. I can’t enter.","steps":["Ключей нет сейчас: важен результат.","have + lost."],"answer":"I have lost my keys.","translation":"Я потерял ключи (и сейчас не могу войти)."},{"question":"I ___ (lose) my keys yesterday.","steps":["Yesterday — конкретное прошлое время.","Past Simple: lose → lost."],"answer":"I lost my keys yesterday.","translation":"Я потерял ключи вчера."},{"question":"She ___ (just/arrive).","steps":["Just показывает недавний результат (типично для британского английского).","has + just + arrived."],"answer":"She has just arrived.","translation":"Она только что приехала."}]},{"id":"eng14","subject":"eng","title":"Future Simple: will / won’t","formula":"will + V; won’t + V; Will + S + V?","hint":"Will для решения прямо сейчас, обещания или предположения. После will всегда начальная форма без to.","examples":[{"question":"I think it ___ (rain) tomorrow.","steps":["Предположение о будущем: will.","will + rain."],"answer":"I think it will rain tomorrow.","translation":"Думаю, завтра будет дождь."},{"question":"I ___ (help) you, I promise.","steps":["Обещание: will help.","will + help."],"answer":"I will help you, I promise.","translation":"Я тебе помогу, обещаю."},{"question":"___ you ___ (call) me tonight?","steps":["Вопрос о будущем: Will + you + call.","Will + you + call?"],"answer":"Will you call me tonight?","translation":"Ты позвонишь мне сегодня вечером?"}]},{"id":"eng15","subject":"eng","title":"Be going to: намерения и прогнозы","formula":"am/is/are going to + V.","hint":"Going to выбираем для заранее принятого плана или прогноза по видимым признакам.","examples":[{"question":"We ___ (visit) our cousins next week.","steps":["По контексту это запланированное намерение.","We + are going to + visit."],"answer":"We are going to visit our cousins next week.","translation":"Мы собираемся навестить двоюродных братьев на следующей неделе."},{"question":"Look at the clouds! It ___ (rain).","steps":["Видимые признаки надвигающегося дождя.","It + is going to + rain."],"answer":"It is going to rain.","translation":"Сейчас пойдёт дождь."},{"question":"She ___ (not/buy) a new phone.","steps":["She → is, отрицание is not going to.","She + isn’t going to + buy."],"answer":"She isn’t going to buy a new phone.","translation":"Она не собирается покупать новый телефон."}]},{"id":"eng16","subject":"eng","title":"Будущее: will, going to и Present Continuous","formula":"will + V | be going to + V | am/is/are + V-ing (договорённость).","hint":"Will — решение в момент речи; going to — намерение; Continuous — конкретная договорённость с временем/местом.","examples":[{"question":"The phone is ringing. I ___ (answer) it.","steps":["Решение принимается сейчас.","will + answer."],"answer":"I will answer it.","translation":"Я отвечу на звонок."},{"question":"I have bought a ticket. I ___ (fly) on Friday.","steps":["Билет есть, поездка согласована.","am flying (Present Continuous с будущим значением)."],"answer":"I am flying on Friday.","translation":"Я лечу в пятницу."},{"question":"I have decided: I ___ (learn) French.","steps":["Решение принято заранее: намерение.","am going to + learn."],"answer":"I am going to learn French.","translation":"Я собираюсь учить французский."}]},{"id":"eng17","subject":"eng","title":"Порядок слов в вопросах","formula":"Question word + do/does/did + subject + V? | What + is/are + subject + V-ing?","hint":"В общем вопросе сначала вспомогательный глагол, затем подлежащее. Who как подлежащее часто не требует do.","examples":[{"question":"Where / you / live ?","steps":["Present Simple, подлежащее you → do.","Where + do + you + live?"],"answer":"Where do you live?","translation":"Где ты живёшь?"},{"question":"When / she / leave / yesterday ?","steps":["Прошедшее время: did, leave начальная форма.","When + did + she + leave?"],"answer":"When did she leave yesterday?","translation":"Когда она ушла вчера?"},{"question":"What / they / do / now ?","steps":["Now → Present Continuous; they → are.","What + are + they + doing?"],"answer":"What are they doing now?","translation":"Что они сейчас делают?"}]},{"id":"eng18","subject":"eng","title":"Краткие ответы Yes / No","formula":"Do you …? — Yes, I do. / No, I don’t. Is he …? — Yes, he is. / No, he isn’t.","hint":"В кратком ответе повтори вспомогательный глагол из вопроса, а не смысловой.","examples":[{"question":"Do they play chess? (да)","steps":["В вопросе do; подлежащее they.","Yes + they + do."],"answer":"Yes, they do.","translation":"Да, играют."},{"question":"Is she reading? (нет)","steps":["В вопросе is; ответ с she.","No + she + is not."],"answer":"No, she isn’t.","translation":"Нет, не читает."},{"question":"Did you see him? (да)","steps":["В вопросе did; ответ от первого лица.","Yes + I + did."],"answer":"Yes, I did.","translation":"Да, видел."}]},{"id":"eng19","subject":"eng","title":"Артикли a / an / the / нулевой","formula":"a/an = один из, любой; the = конкретный, известный; ∅ = без артикля.","hint":"A/an зависит от ЗВУКА (an hour, a university). Перед неисчисляемыми и множественными в общем смысле артикль часто отсутствует.","examples":[{"question":"I saw ___ elephant.","steps":["Elephant начинается с гласного звука.","an + elephant."],"answer":"I saw an elephant.","translation":"Я видел слона."},{"question":"I have a dog. ___ dog is friendly.","steps":["Собака уже названа и известна собеседнику.","the + dog."],"answer":"The dog is friendly.","translation":"Эта собака дружелюбная."},{"question":"___ Water is important for life.","steps":["Water — неисчисляемое вещество в общем смысле.","Без артикля."],"answer":"Water is important for life.","translation":"Вода важна для жизни."}]},{"id":"eng20","subject":"eng","title":"Множественное число существительных","formula":"cat→cats; box→boxes; city→cities; child→children; man→men; mouse→mice.","hint":"После согласной + y: -ies, после -s/-sh/-ch/-x: -es. Исключения запоминай.","examples":[{"question":"There are three ___ (baby).","steps":["Согласная + y → -ies.","baby → babies."],"answer":"There are three babies.","translation":"Там трое малышей."},{"question":"Two ___ (child) are playing.","steps":["Child имеет неправильное множественное число.","child → children."],"answer":"Two children are playing.","translation":"Двое детей играют."},{"question":"I bought four ___ (box).","steps":["После -x добавляем -es.","box → boxes."],"answer":"I bought four boxes.","translation":"Я купил четыре коробки."}]},{"id":"eng21","subject":"eng","title":"Исчисляемые и неисчисляемые существительные","formula":"countable: a book, two books; uncountable: milk, rice, advice, information.","hint":"С неисчисляемым нельзя a/an или множественное окончание; нужны some, a piece of, a glass of.","examples":[{"question":"I need ___ (a / some) water.","steps":["Water — неисчисляемое.","some + water."],"answer":"I need some water.","translation":"Мне нужно немного воды."},{"question":"She gave me two ___ (piece) of advice.","steps":["Advice неисчисляемое; считаем части/советы через pieces.","two + pieces of advice."],"answer":"She gave me two pieces of advice.","translation":"Она дала мне два совета."},{"question":"There are three ___ (apple) on the table.","steps":["Apple — исчисляемое, после three множественное число.","apple → apples."],"answer":"There are three apples on the table.","translation":"На столе три яблока."}]},{"id":"eng22","subject":"eng","title":"Some / any / no","formula":"some в утверждениях; any часто в вопросах/отрицаниях; no + существительное = отсутствие.","hint":"Some в вопросах возможно в предложениях и просьбах: Would you like some tea?","examples":[{"question":"I have ___ friends here. (утверждение)","steps":["Положительное предложение → some.","some + friends."],"answer":"I have some friends here.","translation":"У меня здесь есть друзья."},{"question":"Have you got ___ pencils?","steps":["Нейтральный вопрос → any.","any + pencils."],"answer":"Have you got any pencils?","translation":"У тебя есть карандаши?"},{"question":"There is ___ sugar left. (сахара не осталось)","steps":["No перед существительным выражает отсутствие.","no + sugar."],"answer":"There is no sugar left.","translation":"Сахара не осталось."}]},{"id":"eng23","subject":"eng","title":"Much / many / a lot of","formula":"many + исчисляемое мн. число; much + неисчисляемое; a lot of + оба вида.","hint":"How many books? How much money? В простых утвердительных фразах обычно a lot of.","examples":[{"question":"How ___ students are in your class?","steps":["Students можно пересчитать → many.","How many + students."],"answer":"How many students are in your class?","translation":"Сколько учеников в твоём классе?"},{"question":"How ___ milk do we need?","steps":["Milk неисчисляемое → much.","How much + milk."],"answer":"How much milk do we need?","translation":"Сколько молока нам нужно?"},{"question":"There are ___ people here. (много)","steps":["Утверждение, исчисляемое → a lot of.","a lot of + people."],"answer":"There are a lot of people here.","translation":"Здесь много людей."}]},{"id":"eng24","subject":"eng","title":"A few / few и a little / little","formula":"a few / few + исчисляемое; a little / little + неисчисляемое.","hint":"A few / a little = немного, но достаточно. Few / little = мало, почти нет.","examples":[{"question":"I have ___ friends, so I am not lonely. (несколько)","steps":["Friends можно считать; положительный смысл.","a few + friends."],"answer":"I have a few friends, so I am not lonely.","translation":"У меня есть несколько друзей, поэтому я не одинок."},{"question":"We have ___ time; hurry up! (очень мало)","steps":["Time неисчисляемое; времени не хватает.","little + time."],"answer":"We have little time; hurry up!","translation":"У нас мало времени, поспеши!"},{"question":"Add ___ sugar, please. (немного)","steps":["Sugar неисчисляемое; просим немного.","a little + sugar."],"answer":"Add a little sugar, please.","translation":"Добавь немного сахара, пожалуйста."}]},{"id":"eng25","subject":"eng","title":"There is / There are","formula":"There is + ед. число/неисчисляемое; There are + мн. число.","hint":"Используй для «где-то есть/находится». В вопросе Is there…? / Are there…?","examples":[{"question":"___ a cat under the table.","steps":["A cat — единственное число.","There + is + a cat."],"answer":"There is a cat under the table.","translation":"Под столом есть кошка."},{"question":"___ three windows in the room.","steps":["Three windows — множественное число.","There + are."],"answer":"There are three windows in the room.","translation":"В комнате три окна."},{"question":"___ any milk in the fridge? (вопрос)","steps":["Milk неисчисляемое → Is there.","Is + there + any milk?"],"answer":"Is there any milk in the fridge?","translation":"В холодильнике есть молоко?"}]},{"id":"eng26","subject":"eng","title":"Сравнительная и превосходная степень","formula":"tall→taller→the tallest; beautiful→more beautiful→the most beautiful; good→better→the best.","hint":"Коротким прилагательным обычно -er/-est, длинным more/most. В превосходной часто используется the.","examples":[{"question":"This road is ___ (long) than that one.","steps":["Сравниваем два предмета, long — короткое слово.","long + er → longer."],"answer":"This road is longer than that one.","translation":"Эта дорога длиннее той."},{"question":"She is ___ (good) player on the team.","steps":["Лучший из всей команды → превосходная степень; good — исключение.","good → the best."],"answer":"She is the best player on the team.","translation":"Она лучший игрок в команде."},{"question":"This film is ___ (interesting) than that film.","steps":["Длинное прилагательное: more + adjective.","more + interesting."],"answer":"This film is more interesting than that film.","translation":"Этот фильм интереснее того."}]},{"id":"eng27","subject":"eng","title":"As … as / not as … as","formula":"as + adjective + as; not as + adjective + as.","hint":"As … as выражает равенство признака; not as … as — меньше выраженность признака.","examples":[{"question":"My bag is ___ heavy ___ yours. (такая же)","steps":["Для одинаковой степени признака: as … as.","as + heavy + as."],"answer":"My bag is as heavy as yours.","translation":"Моя сумка такая же тяжёлая, как твоя."},{"question":"The bike is ___ fast ___ the car. (не такая)","steps":["Отрицательное сравнение: not as … as.","not as + fast + as."],"answer":"The bike is not as fast as the car.","translation":"Велосипед не такой быстрый, как машина."},{"question":"Anna is ___ tall ___ Kate. (такая же)","steps":["Равенство роста → as + tall + as.","as + tall + as."],"answer":"Anna is as tall as Kate.","translation":"Анна такого же роста, как Катя."}]},{"id":"eng28","subject":"eng","title":"Прилагательное или наречие?","formula":"adjective + noun: a quick runner; verb + adverb: run quickly; good→well; fast→fast.","hint":"Прилагательное описывает предмет, наречие — действие. После look, feel, seem часто прилагательное.","examples":[{"question":"She sings ___ (beautiful).","steps":["Как поёт? Описывает глагол sings.","beautiful → beautifully."],"answer":"She sings beautifully.","translation":"Она красиво поёт."},{"question":"He is a ___ (careful) driver.","steps":["Какой водитель? Описывает существительное.","careful (прилагательное)."],"answer":"He is a careful driver.","translation":"Он осторожный водитель."},{"question":"Tom runs ___ (fast).","steps":["Fast — одинаковая форма прилагательного и наречия.","fast → fast, не fastly."],"answer":"Tom runs fast.","translation":"Том быстро бегает."}]},{"id":"eng29","subject":"eng","title":"Модальные глаголы can / could / may","formula":"can/could/may + V без to; Can I…? / Could you…? / May I…?","hint":"Can — умение/разрешение, could — способность в прошлом или вежливая просьба, may — формальное разрешение/возможность.","examples":[{"question":"My brother ___ (can/swim).","steps":["После can глагол идёт без to.","can + swim."],"answer":"My brother can swim.","translation":"Мой брат умеет плавать."},{"question":"When I was five, I ___ ride a bike. (не умел)","steps":["Прошлая способность: could, отрицание couldn’t.","could not + ride."],"answer":"When I was five, I couldn’t ride a bike.","translation":"В пять лет я не умел ездить на велосипеде."},{"question":"___ I come in? (вежливо попросить разрешение)","steps":["Для формального разрешения подходит may.","May + I + come in?"],"answer":"May I come in?","translation":"Можно войти?"}]},{"id":"eng30","subject":"eng","title":"Must / mustn’t / have to / don’t have to","formula":"must = обязательно; mustn’t = запрещено; have to = приходится; don’t have to = не обязательно.","hint":"Mustn’t и don’t have to НЕ одно и то же: «нельзя» против «не нужно».","examples":[{"question":"You ___ wear a seat belt. (обязательно)","steps":["Обязательное требование → must.","must + wear."],"answer":"You must wear a seat belt.","translation":"Ты должен пристёгиваться ремнём."},{"question":"You ___ smoke here. (запрещено)","steps":["Запрет: must not (mustn’t).","must not + smoke."],"answer":"You mustn’t smoke here.","translation":"Здесь нельзя курить."},{"question":"It is Sunday. I ___ go to school. (не нужно)","steps":["Отсутствие необходимости → don’t have to.","do not have to + go."],"answer":"I don’t have to go to school.","translation":"Мне не нужно идти в школу."}]},{"id":"eng31","subject":"eng","title":"Should / shouldn’t: советы","formula":"should + V; shouldn’t + V; Should + S + V?","hint":"Should — совет, а не строгое обязательство; после should — глагол без to.","examples":[{"question":"You are tired. You ___ (rest).","steps":["Даём совет отдохнуть.","should + rest."],"answer":"You should rest.","translation":"Тебе стоит отдохнуть."},{"question":"He has a toothache. He ___ (eat) sweets. (не следует)","steps":["Совет не есть сладости → shouldn’t.","should not + eat."],"answer":"He shouldn’t eat sweets.","translation":"Ему не следует есть сладости."},{"question":"___ I ___ (call) the doctor?","steps":["Просьба о совете: Should + I + call.","Should + I + call?"],"answer":"Should I call the doctor?","translation":"Мне стоит позвонить врачу?"}]},{"id":"eng32","subject":"eng","title":"Повелительное наклонение и Let’s","formula":"Open the door!; Don’t run!; Let’s go!; Let’s not argue.","hint":"Команда/просьба: начальная форма без to; запрет: Don’t + V; совместное предложение: Let’s.","examples":[{"question":"___ (open) your books, please.","steps":["Вежливая просьба/команда.","Open + your books."],"answer":"Open your books, please.","translation":"Откройте книги, пожалуйста."},{"question":"___ (not/touch) the glass!","steps":["Отрицательная команда: Don’t.","Don’t + touch."],"answer":"Don’t touch the glass!","translation":"Не трогай стекло!"},{"question":"___ (go) to the park! (предложение вместе)","steps":["Вместе что-то сделать → Let’s.","Let’s + go."],"answer":"Let’s go to the park!","translation":"Давай пойдём в парк!"}]},{"id":"eng33","subject":"eng","title":"Предлоги времени: in / on / at","formula":"at 7 o’clock; on Monday/on 5 May; in June/in 2026/in the morning.","hint":"At — точное время; on — дни и даты; in — месяц, год, время суток. Исключения: at night, on Monday morning.","examples":[{"question":"I get up ___ 7:30.","steps":["Точное время → at.","at + 7:30."],"answer":"I get up at 7:30.","translation":"Я встаю в 7:30."},{"question":"My birthday is ___ October.","steps":["Месяц без конкретной даты → in.","in + October."],"answer":"My birthday is in October.","translation":"Мой день рождения в октябре."},{"question":"We have English ___ Tuesday.","steps":["День недели → on.","on + Tuesday."],"answer":"We have English on Tuesday.","translation":"У нас английский во вторник."}]},{"id":"eng34","subject":"eng","title":"Предлоги места и направления","formula":"in = внутри; on = на поверхности; at = у/в точке; under/behind/between/next to; into = внутрь.","hint":"Смотри на положение и движение: in the box (где?), into the box (куда?).","examples":[{"question":"The keys are ___ the table. (на поверхности)","steps":["На горизонтальной поверхности — on.","on + the table."],"answer":"The keys are on the table.","translation":"Ключи лежат на столе."},{"question":"The cat is ___ the chair. (под)","steps":["Under означает «под».","under + the chair."],"answer":"The cat is under the chair.","translation":"Кот под стулом."},{"question":"The boy jumped ___ the pool. (внутрь)","steps":["Движение снаружи внутрь → into.","into + the pool."],"answer":"The boy jumped into the pool.","translation":"Мальчик прыгнул в бассейн."}]},{"id":"eng35","subject":"eng","title":"This / that / these / those","formula":"this — этот рядом; that — тот далеко; these — эти рядом; those — те далеко.","hint":"Проверь число существительного и расстояние до предмета.","examples":[{"question":"___ is my pen. (рядом, один)","steps":["Единственное число + близко.","this."],"answer":"This is my pen.","translation":"Это моя ручка."},{"question":"___ are my shoes. (рядом, несколько)","steps":["Множественное число + близко.","these."],"answer":"These are my shoes.","translation":"Это мои туфли."},{"question":"___ mountains are beautiful. (далеко, несколько)","steps":["Множественное число + далеко.","those."],"answer":"Those mountains are beautiful.","translation":"Те горы красивые."}]},{"id":"eng36","subject":"eng","title":"Притяжательный падеж ’s / s’","formula":"Kate’s book; the boys’ room; the children’s toys.","hint":"Один владелец: ’s. Множественное на -s: апостроф после s. Неправильное множественное: ’s.","examples":[{"question":"This is ___ (Tom) bike.","steps":["Tom — один владелец.","Tom + ’s."],"answer":"This is Tom’s bike.","translation":"Это велосипед Тома."},{"question":"The ___ (girls) bags are here.","steps":["Girls — множественное число на -s.","girls + ’."],"answer":"The girls’ bags are here.","translation":"Сумки девочек здесь."},{"question":"The ___ (children) toys are new.","steps":["Children — неправильное множественное, без конечного -s.","children + ’s."],"answer":"The children’s toys are new.","translation":"Игрушки детей новые."}]},{"id":"eng37","subject":"eng","title":"Возвратные местоимения myself / yourself / himself","formula":"I→myself; you→yourself/yourselves; he→himself; she→herself; we→ourselves; they→themselves.","hint":"Действие направлено на того, кто его выполняет: сам(а), себя.","examples":[{"question":"I made this cake ___.","steps":["Я сделал сам.","I → myself."],"answer":"I made this cake myself.","translation":"Я сам испёк этот торт."},{"question":"She hurt ___ while playing.","steps":["Действие направлено на неё же.","she → herself."],"answer":"She hurt herself while playing.","translation":"Она ушиблась во время игры."},{"question":"They cleaned the room ___.","steps":["Они убрали комнату сами.","they → themselves."],"answer":"They cleaned the room themselves.","translation":"Они сами убрали комнату."}]},{"id":"eng38","subject":"eng","title":"Местоимения something / anything / nothing","formula":"someone/something/somewhere; anyone/anything/anywhere; nobody/nothing/nowhere.","hint":"Something чаще в утверждениях, anything в вопросах/отрицаниях, nothing уже выражает отрицание — don’t не нужно.","examples":[{"question":"There is ___ in my bag. (что-то)","steps":["Утвердительная форма → something.","some + thing."],"answer":"There is something in my bag.","translation":"В моей сумке что-то есть."},{"question":"Do you need ___?","steps":["Нейтральный вопрос → anything.","any + thing."],"answer":"Do you need anything?","translation":"Тебе что-нибудь нужно?"},{"question":"I saw ___ unusual. (ничего)","steps":["Nothing само по себе уже отрицание.","nothing + unusual."],"answer":"I saw nothing unusual.","translation":"Я не увидел ничего необычного."}]},{"id":"eng39","subject":"eng","title":"Союзы because / so / but / although","formula":"because = потому что; so = поэтому; but = но; although = хотя.","hint":"Because называет причину, so — результат, although — неожиданное противопоставление.","examples":[{"question":"I stayed home ___ I was ill. (потому что)","steps":["Причина: был болен → because.","because + I was ill."],"answer":"I stayed home because I was ill.","translation":"Я остался дома, потому что заболел."},{"question":"It was cold, ___ we closed the window. (поэтому)","steps":["Следствие холода → so.","so + we closed."],"answer":"It was cold, so we closed the window.","translation":"Было холодно, поэтому мы закрыли окно."},{"question":"___ it was raining, we went out. (хотя)","steps":["Противопоставление факту дождя → although.","Although + it was raining."],"answer":"Although it was raining, we went out.","translation":"Хотя шёл дождь, мы вышли на улицу."}]},{"id":"eng40","subject":"eng","title":"Zero и First Conditional","formula":"Zero: If + Present Simple, Present Simple. First: If + Present Simple, will + V.","hint":"Zero — закономерности; First — реальная возможность в будущем. После if в First Conditional обычно НЕ ставят will.","examples":[{"question":"If you heat ice, it ___ (melt).","steps":["Это общий факт → Zero Conditional.","if + Present Simple, Present Simple."],"answer":"If you heat ice, it melts.","translation":"Если нагреть лёд, он тает."},{"question":"If it rains, we ___ (stay) home.","steps":["Возможное событие в будущем → First Conditional.","if it rains, we + will stay."],"answer":"If it rains, we will stay home.","translation":"Если пойдёт дождь, мы останемся дома."},{"question":"If she ___ (study), she will pass the test.","steps":["После if нужен Present Simple, не will study.","she + studies."],"answer":"If she studies, she will pass the test.","translation":"Если она будет заниматься, она сдаст контрольную."}]},{"id":"eng41","subject":"eng","title":"Пассивный залог: Present / Past Simple","formula":"Present: am/is/are + V³. Past: was/were + V³.","hint":"Пассив используют, когда важнее действие над предметом, чем исполнитель. Для правильных глаголов V³ = -ed.","examples":[{"question":"English ___ (speak) in many countries.","steps":["Общее настоящее, English — ед. число.","is + spoken (speak–spoke–spoken)."],"answer":"English is spoken in many countries.","translation":"На английском говорят во многих странах."},{"question":"The window ___ (break) yesterday.","steps":["Законченное прошлое → was + V³.","was + broken."],"answer":"The window was broken yesterday.","translation":"Окно разбили вчера."},{"question":"These books ___ (write) in 2010.","steps":["These books — мн. число, прошлое.","were + written."],"answer":"These books were written in 2010.","translation":"Эти книги были написаны в 2010 году."}]},{"id":"eng42","subject":"eng","title":"Инфинитив to + V и герундий V-ing","formula":"want/decide/hope + to V; enjoy/finish/avoid + V-ing; like + V-ing/to V.","hint":"После разных глаголов разные формы — запоминай управление: enjoy doing, want to do.","examples":[{"question":"I enjoy ___ (read) detective stories.","steps":["После enjoy используется V-ing.","read → reading."],"answer":"I enjoy reading detective stories.","translation":"Мне нравится читать детективы."},{"question":"She wants ___ (learn) English.","steps":["После want ставим to + V.","to + learn."],"answer":"She wants to learn English.","translation":"Она хочет учить английский."},{"question":"They decided ___ (stay) home.","steps":["После decide ставим to + V.","to + stay."],"answer":"They decided to stay home.","translation":"Они решили остаться дома."}]},{"id":"eng43","subject":"eng","title":"Относительные предложения who / which / that / where","formula":"who — люди; which — предметы/животные; that — люди/предметы; where — место.","hint":"Союзное слово соединяет главное предложение с уточнением о человеке, вещи или месте.","examples":[{"question":"A teacher is a person ___ helps students.","steps":["Говорим о человеке → who.","person + who + helps."],"answer":"A teacher is a person who helps students.","translation":"Учитель — человек, который помогает ученикам."},{"question":"This is the book ___ I bought.","steps":["Говорим о книге → which (или that).","book + which + I bought."],"answer":"This is the book which I bought.","translation":"Это книга, которую я купил."},{"question":"This is the town ___ I was born.","steps":["Место рождения → where.","town + where + I was born."],"answer":"This is the town where I was born.","translation":"Это город, где я родился."}]},{"id":"eng44","subject":"eng","title":"Used to: привычки в прошлом","formula":"used to + V; didn’t use to + V; Did + S + use to + V?","hint":"Used to обозначает прошлую привычку/состояние, которых сейчас нет. После did/didn’t форма use to.","examples":[{"question":"I ___ (play) outside every evening when I was little.","steps":["Это была привычка в прошлом.","used to + play."],"answer":"I used to play outside every evening.","translation":"Раньше я каждый вечер играл на улице."},{"question":"She ___ (not/like) fish when she was younger.","steps":["Отрицание прошлой привычки → didn’t use to.","didn’t use to + like."],"answer":"She didn’t use to like fish.","translation":"Раньше она не любила рыбу."},{"question":"___ you ___ (live) here before?","steps":["Вопрос о прошлом: Did + use to.","Did + you + use to + live?"],"answer":"Did you use to live here?","translation":"Ты раньше здесь жил?"}]},{"id":"eng45","subject":"eng","title":"Разделительные вопросы: question tags","formula":"You are ready, aren’t you? She doesn’t sing, does she?","hint":"Положительная основа → отрицательный «хвостик»; отрицательная основа → положительный. Повтори вспомогательный глагол.","examples":[{"question":"He is your friend, ___?","steps":["He is — утверждение, хвостик отрицательный.","is → isn’t he?"],"answer":"He is your friend, isn’t he?","translation":"Он твой друг, правда?"},{"question":"They don’t live here, ___?","steps":["Отрицательная основа → положительный хвостик.","don’t → do they?"],"answer":"They don’t live here, do they?","translation":"Они здесь не живут, верно?"},{"question":"She plays tennis, ___?","steps":["Present Simple с she, в хвостике does.","plays → doesn’t she?"],"answer":"She plays tennis, doesn’t she?","translation":"Она играет в теннис, не так ли?"}]},{"id":"eng46","subject":"eng","title":"Условные слова when / before / after / until","formula":"When/after/before + Present Simple, will + V (о будущем).","hint":"Во временных придаточных о будущем обычно Present Simple после when, after, before, until; не will.","examples":[{"question":"I will call you when I ___ (arrive).","steps":["После when — Present Simple даже о будущем.","I + arrive."],"answer":"I will call you when I arrive.","translation":"Я позвоню тебе, когда приеду."},{"question":"We will go out after it ___ (stop) raining.","steps":["После after выбираем Present Simple.","it + stops."],"answer":"We will go out after it stops raining.","translation":"Мы выйдем, когда дождь закончится."},{"question":"Don’t leave until I ___ (come) back.","steps":["После until — Present Simple.","I + come."],"answer":"Don’t leave until I come back.","translation":"Не уходи, пока я не вернусь."}]},{"id":"eng47","subject":"eng","title":"Предложения с so / such / too / enough","formula":"so + adjective; such + (a/an) + noun phrase; too + adjective; adjective + enough.","hint":"So = так/настолько, such = такой, too = слишком, enough = достаточно.","examples":[{"question":"This bag is ___ heavy to carry. (слишком)","steps":["Слишком тяжёлая → too + adjective.","too + heavy."],"answer":"This bag is too heavy to carry.","translation":"Эта сумка слишком тяжёлая, чтобы её нести."},{"question":"The room is big ___ for us. (достаточно)","steps":["Enough ставится ПОСЛЕ прилагательного.","big + enough."],"answer":"The room is big enough for us.","translation":"Комната достаточно большая для нас."},{"question":"It was ___ a funny story! (такая)","steps":["Перед a + adjective + noun используем such.","such + a funny story."],"answer":"It was such a funny story!","translation":"Это была такая смешная история!"}]},{"id":"eng48","subject":"eng","title":"Фразовые глаголы: самые нужные","formula":"get up — вставать; turn on/off — включить/выключить; look for — искать; put on — надевать; take off — снимать.","hint":"Частица меняет значение глагола. С местоимением у отделяемых фразовых глаголов: turn it off, не turn off it.","examples":[{"question":"Please ___ the lights. (выключи)","steps":["Turn off — выключить.","turn + off + the lights."],"answer":"Please turn off the lights.","translation":"Пожалуйста, выключи свет."},{"question":"I ___ at seven every day. (встаю)","steps":["Get up — вставать с кровати.","get + up."],"answer":"I get up at seven every day.","translation":"Я встаю в семь каждый день."},{"question":"I am ___ my keys. (ищу)","steps":["Look for — искать, сейчас → am looking for.","am + looking for."],"answer":"I am looking for my keys.","translation":"Я ищу свои ключи."}]},{"id":"eng49","subject":"eng","title":"Наречия частотности always / often / never","formula":"always, usually, often, sometimes, rarely, never: перед смысловым глаголом, после to be.","hint":"Never само выражает отрицание; не используй don’t never. С to be: she is always…, без to be: she always goes….","examples":[{"question":"She ___ goes to school by bus. (часто)","steps":["Often ставим перед смысловым goes.","she + often + goes."],"answer":"She often goes to school by bus.","translation":"Она часто ездит в школу на автобусе."},{"question":"He is ___ late. (никогда)","steps":["С to be наречие ставится после is.","is + never + late."],"answer":"He is never late.","translation":"Он никогда не опаздывает."},{"question":"We ___ eat breakfast at 8. (обычно)","steps":["Usually перед смысловым eat.","usually + eat."],"answer":"We usually eat breakfast at 8.","translation":"Обычно мы завтракаем в восемь."}]},{"id":"eng50","subject":"eng","title":"Счётные и порядковые числительные, даты","formula":"one–first (1st), two–second (2nd), three–third (3rd), five–fifth (5th); 20th = twentieth.","hint":"Даты читаются с порядковыми числительными: the fifth of May; пишутся, например, 5 May / May 5.","examples":[{"question":"Это мой ___ (one) день в школе.","steps":["Для порядка нужен first, не one.","one → first."],"answer":"It is my first day at school.","translation":"Это мой первый день в школе."},{"question":"My birthday is on the ___ (five) of May.","steps":["В дате используют порядковое числительное.","five → fifth."],"answer":"My birthday is on the fifth of May.","translation":"Мой день рождения пятого мая."},{"question":"She came ___ (three) in the race.","steps":["Третье место — third.","three → third."],"answer":"She came third in the race.","translation":"Она заняла третье место в забеге."}]},{"id":"eng51","subject":"eng","title":"How long / how often / how far / how much?","formula":"How long — как долго; how often — как часто; how far — как далеко; how much — сколько (неисчисляемое/цена).","hint":"Отталкивайся от ответа: время, частота, расстояние или количество/стоимость.","examples":[{"question":"___ do you visit grandma? — Every week.","steps":["Every week указывает на частоту.","How often?"],"answer":"How often do you visit grandma?","translation":"Как часто ты навещаешь бабушку?"},{"question":"___ is the station? — Two kilometres away.","steps":["Два километра — расстояние.","How far?"],"answer":"How far is the station?","translation":"Как далеко станция?"},{"question":"___ does the lesson last? — Forty minutes.","steps":["Сорок минут — длительность.","How long?"],"answer":"How long does the lesson last?","translation":"Сколько длится урок?"}]}];
</script><script>
'use strict';
const C={alg:{name:'Алгебра',icon:'∑',color:'#b68aff',subtitle:'Выражения и уравнения'},geo:{name:'Геометрия',icon:'△',color:'#5cc7ff',subtitle:'Углы и треугольники'},phy:{name:'Физика',icon:'⚛',color:'#4ee6b5',subtitle:'Законы и задачи'},rus:{name:'Русский язык',icon:'Аа',color:'#ff8caa',subtitle:'Правила и разборы'},eng:{name:'Английский язык',icon:'EN',color:'#ffce79',subtitle:'Грамматика и перевод'}};
let state={page:'home',subject:null,lesson:null,query:'',filter:'all',expanded:new Set(),seen:new Set()};
function readStore(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(_){return []}}
let favorites=new Set(readStore('favorites')),done=new Set(readStore('done'));
function store(){try{localStorage.setItem('favorites',JSON.stringify([...favorites]));localStorage.setItem('done',JSON.stringify([...done]))}catch(_){}}
function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(page,subject=null){state.page=page;state.subject=subject;state.lesson=null;state.query='';state.filter='all';window.scrollTo(0,0);render()}
function openLesson(id){state.page='detail';state.lesson=id;state.expanded=new Set([0]);window.scrollTo(0,0);render()}
window.backApp=function(){if(state.page==='detail')go(state.subject?'subject':'home',state.subject);else if(state.page!=='home')go('home');else return false;return true};
function setSearch(v){state.query=v;const list=document.getElementById('results');if(list)list.innerHTML=listMarkup();}
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);store();render()}
function toggleDone(id){done.has(id)?done.delete(id):done.add(id);store();render()}
function toggleEx(n){state.expanded.has(n)?state.expanded.delete(n):state.expanded.add(n);render();}
function nav(){const current=state.page;let a=[['home','⌂','Главная'],['catalog','∑','Темы'],['favorites','☆','Избранное'],['progress','✓','Прогресс']];document.getElementById('navbar').innerHTML=a.map(([id,icon,txt])=>`<button class="nav-btn ${current===id||(id==='catalog'&&current==='subject')?'active':''}" onclick="go('${id}')"><span>${icon}</span>${txt}</button>`).join('')}
function header(title,sub=''){return `<header class="topbar"><button class="back" onclick="backApp()">‹</button><div><div class="headings">${e(title)}</div><div class="small">${e(sub)}</div></div></header>`}
function subjBoxes(){return `<div class="subjects">${Object.entries(C).map(([id,c])=>`<button class="subject" style="--c:${c.color}" onclick="go('subject','${id}')"><div class="sym">${c.icon}</div><b>${c.name}</b><small>${c.subtitle}</small><span class="trailing">${LESSONS.filter(x=>x.subject===id).length} тем →</span></button>`).join('')}</div>`}
function lessonRow(x){return `<button class="lesson" onclick="state.subject='${x.subject}';openLesson('${x.id}')"><span class="num ${x.subject}">${C[x.subject].icon}</span><span style="min-width:0;flex:1"><b>${e(x.title)} ${done.has(x.id)?'✔':''}</b><small>${e(x.formula)}</small></span><span class="arrow">›</span></button>`}
function filtered(){return LESSONS.filter(x=>(!state.subject||x.subject===state.subject)&&(!state.query||[x.title,x.formula,x.hint,C[x.subject].name,...x.examples.flatMap(z=>[z.question,z.answer,z.translation||'',...z.steps])].join(' ').toLowerCase().includes(state.query.toLowerCase()))&&(state.filter==='all'||(state.filter==='favorites'&&favorites.has(x.id))||(state.filter==='done'&&done.has(x.id))))}
function listMarkup(){const items=filtered();return items.length?`<div class="grid-list">${items.map(lessonRow).join('')}</div>`:'<div class="empty">Ничего не найдено.<br>Попробуй другой запрос.</div>'}
function searchBox(){return `<div class="search"><span>⌕</span><input type="search" placeholder="Поиск: формула, тема, слово..." aria-label="Поиск" value="${e(state.query)}" oninput="setSearch(this.value)"></div>`}
function topicPage(){let head=state.subject?C[state.subject].name:'Все темы';let count=filtered().length;return header(head,`${count} тем · по 3 примера с решением`)+searchBox()+`<div class="tools">${[['all','Все темы'],['favorites','☆ Избранное'],['done','✓ Изучено']].map(([k,v])=>`<button class="pill ${state.filter===k?'active':''}" onclick="state.filter='${k}';render()">${v}</button>`).join('')}</div><div id="results">${listMarkup()}</div>`}
function homePage(){return `<header class="topbar"><div class="logo">7</div><div><div class="top-title">Решебник<br>7 класс</div><div class="subtitle">Умные подсказки каждый день ✨</div></div></header><section class="hero"><div class="eyebrow">УЧИСЬ С УДОВОЛЬСТВИЕМ</div><h1>Понять легко.<br>Решить самому.</h1><p>Формулы, правила, подсказки и пошаговые решения для школьных задач.</p><div class="metric-row"><div class="metric"><b>${Object.keys(C).length}</b>предметов</div><div class="metric"><b>${LESSONS.length}</b>тем</div><div class="metric"><b>${LESSONS.length*3}</b>примера</div></div></section><div class="heading"><strong>Выбери предмет</strong><small>7 класс</small></div>${subjBoxes()}<div class="heading"><strong>Твой прогресс</strong><small>${done.size} из ${LESSONS.length} тем</small></div><div class="progress"><div style="width:${done.size/LESSONS.length*100}%"></div></div><div class="toast">Открой тему, изучи решения и отметь её как пройденную.</div><div class="heading"><strong>Быстрый доступ</strong></div><div class="grid-list">${LESSONS.filter(l=>favorites.has(l.id)).slice(0,3).map(lessonRow).join('')||`<div class="empty" style="padding:15px">☆ Добавляй понравившиеся темы в избранное.</div>`}</div>`}
function detailPage(){let l=LESSONS.find(l=>l.id===state.lesson);if(!l)return homePage();let col=C[l.subject];return `<div style="--c:${col.color}">${header(l.title,col.name)}<span class="tag">${col.icon} ${col.name}</span><div class="tools"><button class="pill ${favorites.has(l.id)?'active':''}" onclick="toggleFav('${l.id}')">${favorites.has(l.id)?'★ В избранном':'☆ В избранное'}</button><button class="pill ${done.has(l.id)?'active':''}" onclick="toggleDone('${l.id}')">${done.has(l.id)?'✓ Изучено':'✓ Отметить изученным'}</button></div><div class="formula"><div class="eyebrow">📘 Правило / формула</div><div class="math">${e(l.formula)}</div></div><div class="tip"><b>💡 Подсказка</b><p>${e(l.hint)}</p></div><div class="heading"><strong>3 примера с решениями</strong><small>Нажми для разбора</small></div>${l.examples.map((x,n)=>`<section class="excard"><button class="exheader" onclick="toggleEx(${n})"><span class="bubble">${n+1}</span><div class="ex-title">${e(x.question)}</div><span class="chev">${state.expanded.has(n)?'⌃':'⌄'}</span></button>${state.expanded.has(n)?`<div class="exbody"><div class="mini-tip">💡 ${e(l.hint)}</div>${x.steps.map((s,i)=>`<div class="step"><i>${i+1}</i><span>${e(s)}</span></div>`).join('')}<div class="ans">✓ Ответ: ${e(x.answer)}</div>${x.translation?`<div class="translation"><b>🌍 Перевод:</b> ${e(x.translation)}</div>`:""}</div>`:''}</section>`).join('')}<div class="small" style="text-align:center;margin-top:25px">Задачи решены для тренировки понимания, а не для списывания 🙂</div></div>`}
function render(){nav();const app=document.getElementById('app');if(state.page==='home')app.innerHTML=homePage();else if(state.page==='subject'||state.page==='catalog')app.innerHTML=topicPage();else if(state.page==='detail')app.innerHTML=detailPage();else if(state.page==='favorites'){state.subject=null;state.filter='favorites';app.innerHTML=header('Избранное','Любимые темы под рукой')+`<div id="results">${listMarkup()}</div>`}else if(state.page==='progress'){state.subject=null;state.filter='done';app.innerHTML=header('Мой прогресс',`${done.size} из ${LESSONS.length} тем изучено`)+`<div class="progress"><div style="width:${done.size/LESSONS.length*100}%"></div></div><div class="heading"><strong>Пройденные темы</strong></div><div id="results">${listMarkup()}</div>`}else app.innerHTML=homePage()}
render();
</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
